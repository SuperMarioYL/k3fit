<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" data-palette="5ee656-6ae7a6-cbf6ac-fe6927514783" role="img" aria-labelledby="process-light-title process-light-desc"><title id="process-light-title">K3Fit process</title><desc id="process-light-desc">Both calculations run offline; reported tps is a heuristic, not a benchmark.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="465"><stop stop-color="#368331"/><stop offset=".6" stop-color="#3b815d"/><stop offset="1" stop-color="#657a56"/></linearGradient><radialGradient id="halo"><stop stop-color="#368331" stop-opacity=".22"/><stop offset="1" stop-color="#f9fef9" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cef7cb" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#368331" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="465" rx="16" fill="#f9fef9"/><rect width="1000" height="465" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="199.95" rx="500.0" ry="325.5" fill="url(#halo)"/><text x="44" y="44" fill="#577b6b" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="44" y="84.0" fill="#142a1c" font-size="30" text-anchor="start" font-weight="400">Compare two explicit budget scenarios</text><path d="M332.0 237H356.0" fill="none" stroke="#368331" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M332.0 237H356.0" class="flow" fill="none" stroke="#657a56" stroke-width="2"/><rect x="44.0" y="176" width="288.0" height="122" rx="12" fill="#f7fef7" stroke="#cef7cb"/><text x="62.0" y="207.0" fill="#142a1c" font-size="21" text-anchor="start" font-weight="400">01  Provide budgets</text><text x="62.0" y="259.0" fill="#577b6b" font-size="17" text-anchor="start" font-weight="400">32/128 and 96/256 GiB</text><path d="M644.0 237H668.0" fill="none" stroke="#368331" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M644.0 237H668.0" class="flow" fill="none" stroke="#657a56" stroke-width="2"/><rect x="356.0" y="176" width="288.0" height="122" rx="12" fill="#f7fef7" stroke="#cef7cb"/><text x="374.0" y="207.0" fill="#142a1c" font-size="21" text-anchor="start" font-weight="400">02  Apply profile</text><text x="374.0" y="259.0" fill="#577b6b" font-size="17" text-anchor="start" font-weight="400">Embedded state and KV</text><text x="374.0" y="282.8" fill="#577b6b" font-size="17" text-anchor="start" font-weight="400">constants</text><rect x="668.0" y="176" width="288.0" height="122" rx="12" fill="#f7fef7" stroke="#cef7cb"/><text x="686.0" y="207.0" fill="#142a1c" font-size="21" text-anchor="start" font-weight="400">03  Inspect estimates</text><text x="686.0" y="259.0" fill="#577b6b" font-size="17" text-anchor="start" font-weight="400">All tiers, then</text><text x="686.0" y="282.8" fill="#577b6b" font-size="17" text-anchor="start" font-weight="400">constrained Q3_K_M</text><text x="44" y="379.0" fill="#657a56" font-size="20" text-anchor="start" font-weight="400">Both calculations run offline; reported tps is a heuristic, not a benchmark.</text></svg>
