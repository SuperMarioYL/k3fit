<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="K3Fit pipeline: CLI flags → Delta-Attention account → quant+fit solver → tps+report">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- title -->
  <text x="440" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#6E6E73">K3Fit pipeline — pure arithmetic, no model download, no GPU</text>

  <!-- static connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="200" y1="170" x2="250" y2="170" marker-end="url(#ah-l)"/>
    <line x1="420" y1="170" x2="470" y2="170" marker-end="url(#ah-l)"/>
    <line x1="640" y1="170" x2="690" y2="170" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching-dash data flow (infinite, staggered) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="200" y1="170" x2="246" y2="170" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="420" y1="170" x2="466" y2="170" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="640" y1="170" x2="686" y2="170" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- data packet dots -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M200,170 L246,170" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M420,170 L466,170" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M640,170 L686,170" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes -->
  <g>
    <!-- Node 1: CLI flags -->
    <rect x="30" y="130" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="115" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">CLI flags</text>
    <text x="115" y="188" text-anchor="middle" font-size="11" fill="#6E6E73">--vram --ram</text>

    <!-- Node 2: Delta-Attention account -->
    <rect x="250" y="130" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="335" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Delta-Attention</text>
    <text x="335" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">account</text>
    <text x="335" y="198" text-anchor="middle" font-size="11" fill="#6E6E73">69 DA + 24 KV layers</text>

    <!-- Node 3: Quant + fit solver -->
    <rect x="470" y="130" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="555" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">Quant + fit</text>
    <text x="555" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">solver</text>
    <text x="555" y="198" text-anchor="middle" font-size="11" fill="#6E6E73">max-ctx per tier</text>

    <!-- Node 4: TPS + report -->
    <rect x="690" y="130" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.55s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="775" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">TPS + report</text>
    <text x="775" y="188" text-anchor="middle" font-size="11" fill="#6E6E73">±30% heuristic</text>
  </g>

  <!-- bottom annotation -->
  <text x="440" y="275" text-anchor="middle" font-size="12" fill="#6E6E73">K3Fit is arithmetic over a fixed K3 spec + a quant table — one process, no network, no model file.</text>
  <text x="440" y="295" text-anchor="middle" font-size="12" fill="#6E6E73">Delta-Attention replaces the KV cache in 69/93 layers with a 128×128 matrix/head → 3.9× memory savings.</text>
</svg>
